<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文心觀照 - 線上留言板</title>

  <!-- 手機加入桌面 App 圖示設定 -->
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1og0C_G3CP0USYrX33zs-d89sSAp00Wdy&sz=w512">
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1og0C_G3CP0USYrX33zs-d89sSAp00Wdy&sz=w512">

  <style>
    :root {
      /* 暖色系配置 */
      --bg-color: #faf7f2;          /* 暖米杏底色 */
      --card-bg: #ffffff;           /* 純白卡片 */
      --primary-color: #8c5e3c;     /* 暖木褐 / 焦糖木質 */
      --primary-hover: #734a2e;
      --accent-color: #c97a56;      /* 暖陶紅 / 陶土橙 */
      --accent-light: #fbeee6;      /* 陶土淡底色 */
      --guide-bg: #f7f2ea;          /* 指南針淡杏色 */
      --text-main: #3d312a;         /* 深暖灰褐字 */
      --text-muted: #7d7067;        /* 次要文字灰褐色 */
      --border-color: #e5ded5;      /* 溫和分隔線 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    /* 頂部標題 */
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 46px;
      margin: 0 0 10px 0;
      color: var(--primary-color);
      letter-spacing: 3px;
    }

    /* 角色插圖樣式 (縮小、透明無底色、置中) */
    .banner-wrapper {
      width: 100%;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }
    .banner-img {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      background: transparent;
    }

    /* 分頁切換列 */
    .tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 16px 12px;
      font-size: 32px;
      font-weight: 700;
      border: 3px solid var(--primary-color);
      border-radius: 12px;
      background: #ffffff;
      color: var(--primary-color);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
    }

    /* 資訊導讀卡片 (本月主題、說明、指南針) */
    .intro-card {
      background: var(--card-bg);
      border-left: 10px solid var(--accent-color);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(140, 94, 60, 0.08);
      margin-bottom: 24px;
    }
    .topic-badge {
      display: inline-block;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-color);
      padding: 6px 20px;
      border-radius: 30px;
      margin-bottom: 12px;
    }
    .intro-topic-title {
      font-size: 40px;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* 主題說明：緊湊、直接呈現純文字 */
    .intro-desc {
      font-size: 32px;
      color: var(--text-main);
      margin-bottom: 16px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* 觀行指南針提示區 (向上微調位置、減小上邊距) */
    .intro-guide {
      background: var(--guide-bg);
      border: 2px dashed #d1b8a5;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 32px;
      color: #4a3b32;
      line-height: 1.6;
      margin-top: 8px;
    }
    .guide-title {
      font-weight: 800;
      color: var(--primary-color);
      margin: 0 0 12px 0;
      font-size: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 指南針清單項目 (星星 + 內文) */
    .guide-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .guide-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 32px;
      line-height: 1.6;
    }
    .guide-star {
      flex-shrink: 0;
      font-size: 30px;
      line-height: 1.6;
      user-select: none;
    }
    .guide-text {
      flex: 1;
    }

    /* 表單區塊 */
    .form-card {
      background: var(--card-bg);
      padding: 28px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(140, 94, 60, 0.08);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-color);
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 32px;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-color);
    }
    input[readonly] {
      background-color: #f7f3ee;
      color: var(--text-muted);
      cursor: not-allowed;
    }
    textarea {
      resize: vertical;
      min-height: 180px;
    }

    /* 按鈕樣式 */
    .action-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 18px 24px;
      font-size: 34px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background-color: var(--primary-hover);
    }
    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 心得牆區塊 */
    .wall-header-btn {
      background-color: #e8dcd0;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      padding: 16px;
      font-size: 32px;
      font-weight: 700;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      margin-bottom: 24px;
      text-align: center;
    }
    .msg-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(140, 94, 60, 0.06);
      margin-bottom: 22px;
      border-left: 8px solid var(--primary-color);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      font-size: 32px;
      color: var(--text-muted);
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }
    .msg-author {
      font-weight: 800;
      color: var(--primary-color);
    }
    .msg-topic-tag {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent-color);
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 32px;
      margin-bottom: 14px;
    }
    .msg-body {
      white-space: pre-wrap;
      font-size: 32px;
      color: var(--text-main);
    }
    .status-hint {
      text-align: center;
      font-size: 32px;
      color: var(--text-muted);
      padding: 40px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>文心觀照</h1>
  </header>

  <!-- 角色插圖 (縮小且無底色) -->
  <div class="banner-wrapper">
    <img 
      class="banner-img" 
      src="https://lh3.googleusercontent.com/d/19G8WubK-SasdYuJ-GMY_gSFUijPkTYiQ" 
      alt="文心觀照 插圖"
      loading="lazy"
    >
  </div>

  <!-- 頁籤導覽列 (分頁切換) -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabWriteBtn" onclick="switchView('write')">✍️ 填寫心得</button>
    <button class="tab-btn" id="tabWallBtn" onclick="switchView('wall')">🌸 心光匯萃</button>
  </div>

  <!-- 本月主題導讀卡片 -->
  <div class="intro-card">
    <div class="topic-badge">本月主題</div>
    <div class="intro-topic-title" id="displayTopic">載入主題中...</div>
    
    <!-- 主題說明：直接顯示內容 -->
    <div class="intro-desc" id="displayDesc"></div>

    <!-- 觀行指南針：附指南針圖示與自動星星清單 -->
    <div class="intro-guide" id="guideBox" style="display: none;">
      <div class="guide-title">🧭 觀行指南針</div>
      <div class="guide-list" id="displayGuide"></div>
    </div>
  </div>

  <!-- 【分頁一：留言填寫區】 -->
  <div id="writeSection">
    <div class="form-card">
      <form id="commentForm">
        <div class="form-group">
          <label for="name">姓名</label>
          <input type="text" id="name" required placeholder="請填寫您的姓名">
        </div>
        <div class="form-group">
          <label for="dharmaName">法名</label>
          <input type="text" id="dharmaName" placeholder="請填寫您的法名">
        </div>
        <div class="form-group">
          <label for="topic">本月主題</label>
          <input type="text" id="topic" readonly value="載入中...">
        </div>
        <div class="form-group">
          <label for="content">觀行心得</label>
          <textarea id="content" required placeholder="請依本月主題與觀行指南針，寫下您的日常觀照心得......"></textarea>
        </div>
        <button type="submit" class="action-btn" id="submitBtn">送出觀照心得</button>
      </form>
    </div>
  </div>

  <!-- 【分頁二：心得牆展示區】 -->
  <div id="wallSection" style="display: none;">
    <button class="wall-header-btn" onclick="switchView('write')">⬅️ 返回填寫心得留言</button>
    <div id="wallMessagesList">
      <div class="status-hint">正在載入本月心得...</div>
    </div>
  </div>
</div>

<script>
  // 您的 Apps Script 專屬 API 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyln_3FkO3-aJnJ_n9Ny-RZrZP_OBdbSDVorNQvOOFbj6a7gYIgHpYXXMulWz0Eke4/exec";

  let currentTopicName = "";
  let allMessages = [];

  // 切換分頁邏輯
  function switchView(viewName) {
    const writeSection = document.getElementById("writeSection");
    const wallSection = document.getElementById("wallSection");
    const tabWriteBtn = document.getElementById("tabWriteBtn");
    const tabWallBtn = document.getElementById("tabWallBtn");

    if (viewName === 'write') {
      writeSection.style.display = "block";
      wallSection.style.display = "none";
      tabWriteBtn.classList.add("active");
      tabWallBtn.classList.remove("active");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      writeSection.style.display = "none";
      wallSection.style.display = "block";
      tabWriteBtn.classList.remove("active");
      tabWallBtn.classList.add("active");
      renderMonthlyWall();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  // 載入資料 (主題、說明、指南針、全部心得)
  async function loadData() {
    try {
      const response = await fetch(GAS_URL);
      if (!response.ok) {
        throw new Error(`HTTP 錯誤: ${response.status}`);
      }
      const data = await response.json();

      currentTopicName = (data.topic || "").trim();
      document.getElementById("displayTopic").innerText = currentTopicName;
      document.getElementById("topic").value = currentTopicName;

      // 1. 呈現主題說明
      const descEl = document.getElementById("displayDesc");
      if (data.description && String(data.description).trim()) {
        descEl.style.display = "block";
        descEl.innerText = String(data.description).trim();
      } else {
        descEl.style.display = "none";
      }

      // 2. 呈現觀行指南針 (依換行切成多點，自動加星星)
      const guideBox = document.getElementById("guideBox");
      const guideContainer = document.getElementById("displayGuide");
      const rawGuide = (data.guide ? String(data.guide) : "").trim();

      if (rawGuide) {
        guideBox.style.display = "block";
        // 依照換行切割每一條項目，並過濾掉空行
        const lines = rawGuide.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        
        guideContainer.innerHTML = lines.map(line => `
          <div class="guide-item">
            <span class="guide-star">⭐</span>
            <span class="guide-text">${escapeHtml(line)}</span>
          </div>
        `).join("");
      } else {
        guideBox.style.display = "none";
      }

      allMessages = data.messages || [];
    } catch (err) {
      document.getElementById("displayTopic").innerText = "無法載入主題，請稍候重整";
      console.error("載入失敗詳細原因：", err);
    }
  }

  // 渲染心得牆 (只挑出符合當月主題的留言)
  function renderMonthlyWall() {
    const container = document.getElementById("wallMessagesList");
    
    const monthlyList = allMessages.filter(m => (m.topic || "").trim() === currentTopicName);

    if (monthlyList.length === 0) {
      container.innerHTML = '<div class="status-hint">本月主題尚無心得分享，歡迎前往留下第一篇心得！</div>';
      return;
    }

    container.innerHTML = monthlyList.map(m => `
      <div class="msg-card">
        <div class="msg-header">
          <span class="msg-author">${escapeHtml(m.name)} ${m.dharmaName && m.dharmaName !== '無' ? `(${escapeHtml(m.dharmaName)})` : ''}</span>
          <span>${m.time}</span>
        </div>
        <div class="msg-topic-tag">本月：${escapeHtml(m.topic)}</div>
        <div class="msg-body">${escapeHtml(m.content)}</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  // 監聽心得表單送出
  document.getElementById("commentForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "傳送中...";

    const payload = {
      name: document.getElementById("name").value.trim(),
      dharmaName: document.getElementById("dharmaName").value.trim(),
      content: document.getElementById("content").value.trim()
    };

    try {
      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      alert("感恩分享！觀行心得已成功送出。");
      document.getElementById("content").value = "";
      
      // 送出後自動更新並切換至心得牆看最新結果
      await loadData();
      switchView('wall');
    } catch (err) {
      alert("提交失敗，請檢查網路連線或稍後再試。");
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "送出觀照心得";
    }
  });

  loadData();
</script>

</body>
</html>
